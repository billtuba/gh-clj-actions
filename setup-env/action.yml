name: 'Setup Clojure Environment'
description: 'Checkout code, install Java and Clojure, cache dependencies'
runs:
  using: "composite"
  steps:
    - uses: actions/checkout@v6

    - name: Prepare java
      uses: actions/setup-java@v5.7.0
      with:
        distribution: "temurin"
        java-version: "24"

    - name: Install clojure tools
      uses: DeLaGuardo/setup-clojure@13.7.0
      with:
        cli: latest
        bb: latest

    - name: Cache Clojure dependencies
      uses: actions/cache@v5
      with:
        path: |
          ~/.m2/repository
          ~/.gitlibs
          .cpcache
        key: ${{ runner.os }}-clj-${{ hashFiles('deps.edn') }}
        restore-keys: |
          ${{ runner.os }}-clj-
